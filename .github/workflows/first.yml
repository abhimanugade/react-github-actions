name: "first workflow"
on: 
    push: 
    pull_request: 
        # branches: 
        #     - main
jobs: 
    lint-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: run eslint
              run: npm run lint
     
    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: run test cases
              run: npm run test  
     
    build-job:
        needs: [lint-job, test-job]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm install
             
            - name: make react build
              run: npm run build  

            - name: create artifact
              uses: actions/upload-artifact@v4
              with: 
                name: react-build
                path: dist/
                retention-days: 7            
                retention-days: 7            
    deploy-job:
        needs: [lint-job, test-job, build-job]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: "install vercel cli"
              run: npm install --global vercel
              
            - name: deployment on vercel
              run: vercel --prod --yes --token="${{secrets.VERCEL_TOKEN}}"  
              
  

            