name: "first workflow"
on: push
jobs: 
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm install
              
            - name: make react build
              run: npm run build  
                
            